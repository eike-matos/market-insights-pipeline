version: 2

models:
  - name: fct_stock_performance
    description: >
      Aggregated performance per ticker (return, volatility, drawdown) with
      commentary automatically generated by Cortex AI interpreting the numbers.
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
      - name: total_return
        tests:
          - not_null
