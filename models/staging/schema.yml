version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'MARKET_INSIGHTS_PIPELINE') }}"
    schema: raw
    tables:
      - name: stock_prices_raw

models:
  - name: stg_stock_prices
    description: Daily stock prices, cleaned and typed.
    columns:
      - name: ticker
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
